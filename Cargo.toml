[workspace]
members = [
    "crates/stainless-build",
    "crates/stainless-compiler",
    "crates/stainless-http",
    "crates/stainless-runtime",
    "crates/stainless-syntax",
    "crates/stainlessc",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
axum = { version = "0.8.6", features = ["ws"] }
futures-util = "0.3.31"
getrandom = "0.3.4"
logos = "0.16.1"
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.12.4"
rowan = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
syn = { version = "2.0.119", features = ["full"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "sync", "time"] }
toml = "1.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
