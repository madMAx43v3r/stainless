[workspace]
members = ["crates/stainless-compiler", "crates/stainless-syntax"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
logos = "0.16.1"
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rowan = "0.16.1"
syn = { version = "2.0.119", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
